name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# содержимое нужно, чтобы пушить в gh-pages; PR — чтобы писать комментарий
permissions:
  contents: write
  pull-requests: write

# пуши в gh-pages из разных PR идут по очереди, иначе ветка конфликтует
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      # полная история: сборка сравнивает pages.csv базовой ветки с текущим
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Проверка синтаксиса PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Адрес стенда
        # Pages публикует папку PR в /<репозиторий>/pr-<номер>.
        # Ссылки в HTML должны быть абсолютными с этим префиксом,
        # иначе CSS и форма уходят в 404.
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OWNER="${OWNER,,}"
          REPO="${REPO,,}"
          SITE="https://${OWNER}.github.io"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            PREFIX=""
          else
            PREFIX="/${REPO}"
          fi
          echo "SITE_URL=${SITE}" >> "$GITHUB_ENV"
          echo "SITE_BASE=${PREFIX}/pr-${PR}" >> "$GITHUB_ENV"
          echo "STAND_URL=${SITE}${PREFIX}/pr-${PR}/" >> "$GITHUB_ENV"

      - name: Данные страниц
        run: |
          php scripts/split-data.php \
            --site-url="$SITE_URL" \
            --base="$SITE_BASE"

      - name: Сборка статики
        # Pages не запускает PHP: на стенд едут только готовые html и статика.
        # --sample: образцы каждого типа видны, даже если изменений нет.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF" || true
          php scripts/build.php \
            --out=_site \
            --site-url="$SITE_URL" \
            --base="$SITE_BASE" \
            --sample=2 \
            --changed-from="origin/${BASE_REF}"

      - name: Проверка метаданных
        # Падает, если у страницы нет title, h1 или абсолютного canonical.
        run: php scripts/check.php --dir=_site

      - name: Публикация стенда
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Ссылка на стенд в PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "Стенд: ${STAND_URL}"

<form
  class="form"
  id="lead-form"
  method="post"
  action="{{_form_action}}"
  novalidate
>
  <label>
    Имя
    <input type="text" name="name" maxlength="100" autocomplete="name" />
  </label>
  <label>
    Телефон
    <input type="tel" name="phone" required maxlength="40" autocomplete="tel" />
  </label>
  <label>
    Сообщение
    <textarea name="message" maxlength="5000" rows="4"></textarea>
  </label>

  <label class="consent">
    <input type="checkbox" name="consent" value="1" required />
    <span>Согласен на обработку персональных данных</span>
  </label>

  <!-- ловушка для ботов: скрытое поле должно остаться пустым -->
  <div class="honeypot" aria-hidden="true">
    <label>
      Сайт
      <input type="text" name="website" tabindex="-1" autocomplete="off" />
    </label>
  </div>

  <button type="submit">Отправить</button>
  <p class="form__status" id="lead-status" role="status"></p>
</form>
